<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>画像一括トリミング</title>

<!-- ZIP作成ライブラリ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 22px;
}

h1 {
  font-size: 22px;
  margin: 5px 0 25px;
}

.section {
  margin-bottom: 24px;
}

.section-title {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 10px;
}

.upload {
  width: 100%;
  min-height: 160px;
  border: 2px dashed #444;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  background: #1b1b1b;
  cursor: pointer;
  color: #aaa;
  text-align: center;
  padding: 20px;
}

.upload strong {
  color: #fff;
  font-size: 16px;
}

.upload input {
  display: none;
}

.upload.dragover {
  border-color: #a72bbd;
  background: #281b2c;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.small-btn {
  flex: 1;
  padding: 12px;
  background: #292929;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 8px;
  cursor: pointer;
}

.small-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.summary-item {
  background: #1e1e1e;
  padding: 14px 8px;
  border-radius: 9px;
  text-align: center;
}

.summary-number {
  font-size: 23px;
  font-weight: bold;
}

.summary-label {
  font-size: 11px;
  color: #999;
  margin-top: 5px;
}

.ratio-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.ratio-item {
  background: #1e1e1e;
  padding: 12px;
  border-radius: 9px;
  text-align: center;
  border: 1px solid #333;
}

.ratio-name {
  font-size: 15px;
  font-weight: bold;
}

.ratio-count {
  font-size: 12px;
  color: #aaa;
  margin-top: 5px;
}

.ratio-bar {
  height: 4px;
  background: #333;
  border-radius: 5px;
  margin-top: 9px;
  overflow: hidden;
}

.ratio-bar-inner {
  height: 100%;
  background: #a72bbd;
  width: 0%;
}

.file-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 400px;
  overflow-y: auto;
}

.file-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  background: #1c1c1c;
  border-radius: 9px;
  min-width: 0;
}

.file-thumb {
  width: 58px;
  height: 58px;
  object-fit: cover;
  border-radius: 6px;
  background: #333;
  flex-shrink: 0;
}

.file-info {
  min-width: 0;
  flex: 1;
}

.file-name {
  font-size: 13px;
  overflow-wrap: anywhere;
}

.file-detail {
  color: #999;
  font-size: 11px;
  margin-top: 5px;
}

.file-status {
  font-size: 11px;
  color: #aaa;
  margin-top: 5px;
}

.progress-wrap {
  background: #292929;
  height: 7px;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
  display: none;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #a72bbd;
  transition: width .15s;
}

.progress-text {
  color: #aaa;
  font-size: 12px;
  margin-top: 8px;
}

.download {
  width: 100%;
  padding: 16px;
  background: #a72bbd;
  color: white;
  font-size: 15px;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.download:disabled {
  background: #444;
  color: #888;
  cursor: not-allowed;
}

.note {
  font-size: 12px;
  color: #777;
  line-height: 1.8;
  margin-top: 15px;
}

@media(max-width: 400px) {
  .container {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>画像一括トリミング</h1>

  <!-- 画像入力 -->
  <div class="section">

    <div class="section-title">画像を入力</div>

    <label class="upload" id="upload">

      <strong>複数の画像を選択</strong>

      <span>または画像をここにドラッグ＆ドロップ</span>

      <span style="font-size:12px">
        JPG / PNG / WEBP / GIF など
      </span>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
      >

    </label>

    <div class="actions">
      <button class="small-btn" id="addButton">
        ＋ 画像を追加
      </button>

      <button class="small-btn" id="clearButton">
        すべて削除
      </button>
    </div>

  </div>

  <!-- 集計 -->
  <div class="section">

    <div class="section-title">画像の集計</div>

    <div class="summary">

      <div class="summary-item">
        <div class="summary-number" id="totalCount">0</div>
        <div class="summary-label">画像数</div>
      </div>

      <div class="summary-item">
        <div class="summary-number" id="readyCount">0</div>
        <div class="summary-label">処理可能</div>
      </div>

      <div class="summary-item">
        <div class="summary-number" id="errorCount">0</div>
        <div class="summary-label">エラー</div>
      </div>

    </div>

  </div>

  <!-- 比率ごとの集計 -->
  <div class="section">

    <div class="section-title">切り抜きサイズ別</div>

    <div class="ratio-list" id="ratioList"></div>

  </div>

  <!-- 画像一覧 -->
  <div class="section">

    <div class="section-title">入力画像一覧</div>

    <div class="file-list" id="fileList">
      <div style="color:#666;font-size:13px;padding:15px">
        画像がまだ選択されていません
      </div>
    </div>

  </div>

  <!-- 進捗 -->
  <div class="section">

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="progress-text" id="progressText"></div>

  </div>

  <!-- ダウンロード -->
  <div class="section">

    <button class="download" id="downloadButton" disabled>
      ZIPで一括ダウンロード
    </button>

    <div class="note">
      ・画像ごとに最も近い比率を自動判定します。<br>
      ・比率ごとにフォルダを分けて保存します。<br>
      ・切り抜きは元画像の中央を基準に最大面積で行います。<br>
      ・出力形式はPNGです。<br>
      ・画像はサーバーにアップロードされません。
    </div>

  </div>

</div>

<script>
/* ========================================
   設定
======================================== */

const RATIOS = [
  { name: "1:1", folder: "1x1", value: 1 },
  { name: "16:9", folder: "16x9", value: 16 / 9 },
  { name: "3:2", folder: "3x2", value: 3 / 2 },
  { name: "2:3", folder: "2x3", value: 2 / 3 },
  { name: "3:4", folder: "3x4", value: 3 / 4 },
  { name: "4:3", folder: "4x3", value: 4 / 3 },
  { name: "9:16", folder: "9x16", value: 9 / 16 },
  { name: "4:5", folder: "4x5", value: 4 / 5 },
  { name: "5:4", folder: "5x4", value: 5 / 4 }
];

const files = [];

let processing = false;


/* ========================================
   DOM
======================================== */

const fileInput = document.getElementById("fileInput");
const upload = document.getElementById("upload");
const fileList = document.getElementById("fileList");
const ratioList = document.getElementById("ratioList");

const totalCount = document.getElementById("totalCount");
const readyCount = document.getElementById("readyCount");
const errorCount = document.getElementById("errorCount");

const downloadButton = document.getElementById("downloadButton");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");


/* ========================================
   ファイル追加
======================================== */

fileInput.addEventListener("change", event => {
  addFiles(event.target.files);
  fileInput.value = "";
});

document.getElementById("addButton").addEventListener("click", () => {
  fileInput.click();
});

function addFiles(selectedFiles) {

  if (processing) return;

  const newFiles = Array.from(selectedFiles)
    .filter(file => file.type.startsWith("image/"));

  newFiles.forEach(file => {

    const item = {
      id: crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}_${Math.random()}`,

      file,
      name: file.name,
      image: null,
      ratio: null,
      status: "読み込み中",
      error: false,
      output: null,
      previewUrl: null
    };

    files.push(item);

    loadImage(item);
  });

  render();
}


/* ========================================
   画像読み込み
======================================== */

function loadImage(item) {

  const url = URL.createObjectURL(item.file);
  const img = new Image();

  img.onload = () => {

    item.image = img;

    const width = img.naturalWidth;
    const height = img.naturalHeight;

    item.ratio = findNearestRatio(width / height);

    item.status = "準備完了";
    item.error = false;

    item.width = width;
    item.height = height;

    render();
    URL.revokeObjectURL(url);
  };

  img.onerror = () => {

    item.status = "読み込みエラー";
    item.error = true;

    URL.revokeObjectURL(url);
    render();
  };

  img.src = url;
}


/* ========================================
   最も近い比率を判定
======================================== */

function findNearestRatio(sourceRatio) {

  return RATIOS.reduce((best, current) => {

    const currentDiff = Math.abs(
      Math.log(sourceRatio / current.value)
    );

    const bestDiff = Math.abs(
      Math.log(sourceRatio / best.value)
    );

    return currentDiff < bestDiff
      ? current
      : best;

  }, RATIOS[0]);
}


/* ========================================
   画像切り抜き
======================================== */

function cropImage(item) {

  const img = item.image;

  const sourceWidth = img.naturalWidth;
  const sourceHeight = img.naturalHeight;

  const targetRatio = item.ratio.value;
  const sourceRatio = sourceWidth / sourceHeight;

  let cropWidth;
  let cropHeight;
  let cropX;
  let cropY;

  if (sourceRatio > targetRatio) {

    // 横方向を切り抜く

    cropHeight = sourceHeight;
    cropWidth = sourceHeight * targetRatio;

    cropX = (sourceWidth - cropWidth) / 2;
    cropY = 0;

  } else {

    // 縦方向を切り抜く

    cropWidth = sourceWidth;
    cropHeight = sourceWidth / targetRatio;

    cropX = 0;
    cropY = (sourceHeight - cropHeight) / 2;
  }

  const canvas = document.createElement("canvas");

  canvas.width = Math.max(1, Math.round(cropWidth));
  canvas.height = Math.max(1, Math.round(cropHeight));

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    img,
    cropX,
    cropY,
    cropWidth,
    cropHeight,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas;
}


/* ========================================
   ファイル名処理
======================================== */

function getOutputName(name) {

  // 元の拡張子を削除してPNGに変更
  const base = name.replace(/\.[^.]+$/, "");

  return base + ".png";
}

// 同じフォルダ内の重複ファイル名を防ぐ
function uniqueFileName(folder, fileName) {

  if (!folder._usedNames) {
    folder._usedNames = new Set();
  }

  const base = fileName.replace(/\.png$/i, "");
  let result = fileName;
  let count = 2;

  while (folder._usedNames.has(result.toLowerCase())) {
    result = `${base}_${count}.png`;
    count++;
  }

  folder._usedNames.add(result.toLowerCase());

  return result;
}


/* ========================================
   一覧表示
======================================== */

function render() {

  const validFiles = files.filter(item => !item.error);

  const errors = files.filter(item => item.error);

  totalCount.textContent = files.length;
  readyCount.textContent = validFiles.length;
  errorCount.textContent = errors.length;

  // 比率ごとの集計
  ratioList.innerHTML = "";

  RATIOS.forEach(ratio => {

    const count = validFiles.filter(
      item => item.ratio === ratio
    ).length;

    const percent = validFiles.length
      ? count / validFiles.length * 100
      : 0;

    const div = document.createElement("div");
    div.className = "ratio-item";

    div.innerHTML = `
      <div class="ratio-name">${ratio.name}</div>
      <div class="ratio-count">${count} 枚</div>
      <div class="ratio-bar">
        <div class="ratio-bar-inner" style="width:${percent}%"></div>
      </div>
    `;

    ratioList.appendChild(div);
  });

  // ファイル一覧
  fileList.innerHTML = "";

  if (files.length === 0) {

    fileList.innerHTML = `
      <div style="color:#666;font-size:13px;padding:15px">
        画像がまだ選択されていません
      </div>
    `;

  }

  files.forEach(item => {

    const div = document.createElement("div");
    div.className = "file-item";

    const thumb = document.createElement("img");
    thumb.className = "file-thumb";

    if (item.image) {
      thumb.src = item.image.src;
    }

    const info = document.createElement("div");
    info.className = "file-info";

    const name = document.createElement("div");
    name.className = "file-name";
    name.textContent = item.name;

    const detail = document.createElement("div");
    detail.className = "file-detail";

    detail.textContent = item.ratio
      ? `${item.width} × ${item.height}px → ${item.ratio.name}`
      : "";

    const status = document.createElement("div");
    status.className = "file-status";
    status.textContent = item.status;

    info.append(name, detail, status);

    div.append(thumb, info);
    fileList.appendChild(div);
  });

  downloadButton.disabled =
    validFiles.length === 0 || processing;
}


/* ========================================
   すべて削除
======================================== */

document.getElementById("clearButton")
  .addEventListener("click", () => {

    if (processing) return;

    files.length = 0;

    progressBar.style.width = "0%";
    progressWrap.style.display = "none";
    progressText.textContent = "";

    render();
  });


/* ========================================
   ドラッグ＆ドロップ
======================================== */

upload.addEventListener("dragover", event => {
  event.preventDefault();
  upload.classList.add("dragover");
});

upload.addEventListener("dragleave", () => {
  upload.classList.remove("dragover");
});

upload.addEventListener("drop", event => {

  event.preventDefault();

  upload.classList.remove("dragover");

  addFiles(event.dataTransfer.files);
});


/* ========================================
   ZIP作成・一括保存
======================================== */

downloadButton.addEventListener("click", async () => {

  if (processing) return;

  if (typeof JSZip === "undefined") {
    alert("ZIPライブラリを読み込めませんでした。");
    return;
  }

  const targets = files.filter(
    item => item.image && !item.error
  );

  if (targets.length === 0) return;

  processing = true;

  downloadButton.disabled = true;
  downloadButton.textContent = "処理中...";

  progressWrap.style.display = "block";
  progressBar.style.width = "0%";

  const zip = new JSZip();

  // 比率別フォルダは、実際に保存する画像がある場合だけ作成する
  // 先に全フォルダを作成すると、画像がない比率の空フォルダもZIPに含まれる
  const folders = {};

  let completed = 0;
  let failed = 0;

  for (const item of targets) {

    try {

      // 切り抜き
      const canvas = cropImage(item);

      // PNGデータへ変換
      const blob = await new Promise(resolve => {
        canvas.toBlob(resolve, "image/png");
      });

      if (!blob) {
        throw new Error("PNG変換失敗");
      }

      // 保存先フォルダ
      // この比率の画像が初めて正常に処理された時点でフォルダを作成する
      let folder = folders[item.ratio.name];

      if (!folder) {
        folder = zip.folder(item.ratio.folder);
        folders[item.ratio.name] = folder;
      }

      // ファイル名
      const fileName = uniqueFileName(
        folder,
        getOutputName(item.name)
      );

      folder.file(fileName, blob);

      item.status =
        `完了：${item.ratio.folder}/${fileName}`;

    } catch (error) {

      console.error(error);

      item.status = "処理エラー";
      failed++;
    }

    completed++;

    const percent = Math.round(
      completed / targets.length * 100
    );

    progressBar.style.width = percent + "%";

    progressText.textContent =
      `${completed} / ${targets.length} 枚処理済み`;

    render();

    // ブラウザの描画機会を確保
    await new Promise(resolve => setTimeout(resolve, 0));
  }

  if (completed === failed) {

    processing = false;

    downloadButton.textContent = "ZIPで一括ダウンロード";

    render();

    alert("すべての画像の処理に失敗しました。");
    return;
  }

  try {

    progressText.textContent = "ZIPファイルを作成中...";

    const zipBlob = await zip.generateAsync(
      {
        type: "blob",
        compression: "DEFLATE",
        compressionOptions: {
          level: 5
        }
      },
      metadata => {
        progressBar.style.width =
          metadata.percent.toFixed(1) + "%";

        progressText.textContent =
          `ZIP作成中：${metadata.percent.toFixed(1)}%`;
      }
    );

    // ZIPダウンロード
    const url = URL.createObjectURL(zipBlob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "cropped_images.zip";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 60000);

    progressText.textContent =
      `完了：${completed - failed} 枚成功 / ${failed} 枚失敗`;

  } catch (error) {

    console.error(error);

    alert("ZIPファイルの作成に失敗しました。");

    progressText.textContent = "ZIP作成エラー";

  } finally {

    processing = false;

    downloadButton.textContent = "ZIPで一括ダウンロード";

    render();
  }

});


/* ========================================
   初期化
======================================== */

render();

</script>

</body>
</html>
